<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>上野散歩 AI Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: travel-site shell — sticky header, photo hero with AI search, then one view per hash (#home #spots #routes #food #ai) */
:root{
  --bg:#fbf8fa; --surface:#ffffff; --surface-2:#f5f0f6; --ink:#24203a; --muted:#6c6680; --line:#ebe4ee;
  --accent:#4a3fd1; --accent-2:#6d5cf0; --accent-ink:#ffffff; --accent-soft:#ecebff;
  --sakura:#f6d3e1; --sakura-deep:#d2507f; --moss:#d9ecd9; --moss-line:#8cbf93; --water:#bfe0ee; --water-line:#7fb6cf; --rail:#8a8496;
  --shadow:0 10px 30px rgba(52,36,92,.10);
  --f-display:"Zen Kaku Gothic New","Noto Sans JP","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Noto Sans JP","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14121c; --surface:#1e1b29; --surface-2:#252133; --ink:#f1eef8; --muted:#aaa4bd; --line:#312c42;
  --accent:#9d94ff; --accent-2:#b4acff; --accent-ink:#17142a; --accent-soft:#2a2650;
  --sakura:#4a2738; --sakura-deep:#f08cb4; --moss:#1f3326; --moss-line:#4f8d5f; --water:#1c3b4c; --water-line:#3f7e9c; --rail:#7d7790;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14121c; --surface:#1e1b29; --surface-2:#252133; --ink:#f1eef8; --muted:#aaa4bd; --line:#312c42;
  --accent:#9d94ff; --accent-2:#b4acff; --accent-ink:#17142a; --accent-soft:#2a2650;
  --sakura:#4a2738; --sakura-deep:#f08cb4; --moss:#1f3326; --moss-line:#4f8d5f; --water:#1c3b4c; --water-line:#3f7e9c; --rail:#7d7790;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.3;margin:0}
h2{font-size:clamp(22px,3vw,30px);font-weight:900}
h3{font-size:17px;font-weight:700}
.lead{color:var(--muted);max-width:62ch;margin:.4em 0 0}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--sakura-deep);font-weight:700}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--f-display);font-weight:900;font-size:18px;white-space:nowrap}
.brand svg,.brand img{flex:none}
.brand-word{display:grid;line-height:1}
.brand-word b{font-family:"Zen Kaku Gothic New",var(--f-body);font-weight:900;font-size:22px;letter-spacing:.01em;color:var(--ink)}
.demo-tag{font-family:var(--f-body);font-size:12px;font-weight:700;letter-spacing:0;color:var(--sakura-deep);margin-left:2px;vertical-align:middle}
.brand-word small{font-family:var(--f-body);font-weight:700;font-size:10.5px;letter-spacing:.32em;color:var(--muted);margin-top:3px}
nav.main{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
nav.main a{padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap;font-size:14px}
nav.main a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.lang button{border:0;background:none;padding:4px 10px;border-radius:999px;cursor:pointer;font-size:13px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
@media (max-width:820px){
  .top .wrap{flex-wrap:wrap;gap:8px;padding-block:8px}
  nav.main{order:3;width:100%;margin-left:0}
  .lang{margin-left:auto}
}

/* views */
.view{padding-block:36px 64px}
.view[hidden]{display:none}
#v-home{padding-top:0}

/* hero */
.hero{position:relative;color:#fff;isolation:isolate}
.hero-photo{position:relative;min-height:520px;display:flex;align-items:center;overflow:hidden;isolation:isolate}
.hero-photo img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 62%;z-index:-2;max-width:none}
.hero-photo::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse 55% 42% at 50% 46%,rgba(25,20,70,.42),rgba(25,20,70,0) 72%)}
.hero-photo .wrap{width:100%;padding-block:64px 150px;display:grid;gap:14px;justify-items:center;text-align:center}
.hero h1{font-size:clamp(38px,7vw,76px);font-weight:900;color:#fff;text-shadow:0 2px 18px rgba(10,10,40,.55),0 0 3px rgba(10,10,40,.45)}
.hero .tag{font-size:clamp(16px,2.3vw,22px);font-weight:700;color:#fff;text-shadow:0 1px 10px rgba(10,10,40,.65);margin:0}
.hero-cta{display:inline-flex;align-items:center;gap:10px;margin-top:10px;background:linear-gradient(90deg,#ff4f8b,#ff7aa6);color:#fff;text-decoration:none;font-weight:700;font-size:17px;padding:14px 30px;border-radius:999px;box-shadow:0 10px 28px rgba(230,50,110,.45);border:2px solid rgba(255,255,255,.75);transition:transform .15s}
.hero-cta:hover{transform:translateY(-2px)}
.hero-row{position:relative;margin-top:-110px;z-index:2}
.hero-row .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1.4fr);gap:14px;align-items:stretch}
.hcard{background:var(--surface);color:var(--ink);border-radius:16px;overflow:hidden;text-decoration:none;box-shadow:0 12px 30px rgba(40,20,80,.16);display:flex;flex-direction:column;min-width:0;transition:transform .15s}
.hcard:hover{transform:translateY(-3px)}
.hcard img{width:calc(100% - 16px);margin:8px 8px 0;aspect-ratio:4/3;object-fit:cover;display:block;border-radius:12px}
.hcard .b{padding:10px 14px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center}
.hcard b{font-family:var(--f-display);font-size:15px;display:flex;align-items:center;gap:6px;min-width:0}
.hcard small{grid-column:1;color:var(--muted);font-size:12.5px}
.hcard .go{grid-row:1/3;grid-column:2;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.hroutes{background:linear-gradient(180deg,#fff2f7,#ffe1ec);color:#24203a;border-radius:16px;padding:16px;box-shadow:0 12px 30px rgba(40,20,80,.16);display:flex;flex-direction:column;gap:8px;min-width:0}
.hr-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 8px;margin-bottom:2px}
.hr-head b{font-family:var(--f-display);font-size:15px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.hr-head a{color:#4a3fd1;font-size:13px;text-decoration:none;font-weight:700;white-space:nowrap}
.hr-item{display:grid;grid-template-columns:18px auto 1fr;gap:0 8px;align-items:center;background:#fff;border-radius:10px;padding:8px 12px;text-decoration:none;color:#24203a;font-size:14px;font-weight:500}
.hr-item small{color:#6c6680;font-size:12px;font-weight:400;text-align:right;white-space:nowrap}
nav.main a{display:inline-flex;align-items:center;gap:6px}
nav.main a svg{flex:none}
@media (max-width:1000px){.hero-row .wrap{grid-template-columns:repeat(2,minmax(0,1fr))}.hroutes{grid-column:1/-1}}
@media (max-width:700px){.hero-photo{min-height:430px}.hero-photo .wrap{padding-block:48px 130px}}
.section{margin-top:44px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.link-btn{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:700;text-decoration:none}

/* season */
.seasons{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
.season-now{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.season-now img{width:100%;height:100%;object-fit:cover;min-height:220px}
.season-now .body{padding:22px;display:grid;align-content:center;gap:8px}
.season-now .badge{justify-self:start;background:var(--sakura);color:var(--sakura-deep);font-weight:700;font-size:12px;padding:3px 10px;border-radius:999px}
.season-list{display:grid;gap:10px}
.season-list div{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:baseline;padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.season-list div.on{background:var(--accent-soft)}
.season-list b{font-family:var(--f-display);font-size:14px}
.season-list span{color:var(--muted);font-size:13.5px}
@media (max-width:820px){.seasons{grid-template-columns:1fr}.season-now{grid-template-columns:1fr}.season-now img{height:200px}}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card .ph{aspect-ratio:4/3;width:100%;object-fit:cover;display:block;background:var(--surface-2);max-width:100%}
.card .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.card .name-sub{font-size:12px;color:var(--muted)}
.card p{margin:0;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:4px 0 0;font-size:13px}
.card dt{color:var(--muted);white-space:nowrap}
.card dd{margin:0}
.card .foot{margin-top:auto;padding-top:6px;display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px}
.mini{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:14px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.mini .card{scroll-snap-align:start}
.mini .card .ph{aspect-ratio:3/2}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 22px}
.filters button{border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:999px;cursor:pointer;font-size:14px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;padding:12px 22px;border-radius:999px;font-weight:700;text-decoration:none;cursor:pointer;font-size:15px}
.cta.ghost{background:var(--accent-soft);color:var(--accent)}
.cta[disabled]{opacity:.55;cursor:default}

/* routes */
.route-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:start}
@media (max-width:900px){.route-layout{grid-template-columns:1fr}}
.map-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;position:sticky;top:80px}
@media (max-width:900px){.map-box{position:static}}
.map-box svg{width:100%;height:auto;display:block;max-height:78vh}
.map-note{font-size:12px;color:var(--muted);margin:6px 4px 0}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;cursor:pointer;text-align:left;display:grid;line-height:1.35}
.tabs button small{color:var(--muted);font-size:12px}
.tabs button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tabs button[aria-pressed="true"] b{color:var(--accent)}
.route-sum{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin:6px 0 16px}
.route-sum b{color:var(--ink);font-variant-numeric:tabular-nums}
ol.steps{list-style:none;margin:0;padding:0;display:grid}
ol.steps li{display:grid;grid-template-columns:36px 1fr;gap:12px;position:relative;padding-bottom:18px}
ol.steps li:not(:last-child)::before{content:"";position:absolute;left:17px;top:34px;bottom:0;border-left:2px dashed var(--line)}
.num{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.step-body{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:start;min-width:0}
.step-body img{width:72px;height:72px;object-fit:cover;border-radius:10px}
.step-body .t{font-weight:700}
.step-body .m{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.step-body .w{font-size:13.5px;margin-top:2px}
.walkleg{font-size:12px;color:var(--muted);margin:-8px 0 10px 48px}
.note{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--muted)}

/* AI */
.ai-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.ai-layout{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.panel h3{margin-bottom:12px;display:flex;align-items:center;gap:8px}
.field{margin-bottom:14px}
.field>label,.field>.lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts label{cursor:pointer}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts span{display:inline-block;padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;background:var(--surface)}
.opts input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opts input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
textarea#p-extra{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 10px;resize:vertical;min-height:44px}
.chat{display:flex;flex-direction:column;height:min(640px,78vh)}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 10px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;font-size:14.5px;line-height:1.65;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.msg.err{background:var(--sakura);color:var(--ink)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;text-align:left}
.composer{display:flex;gap:8px}
.composer input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:10px 16px;background:var(--surface)}
.composer button{flex:none}
.voice-hint{display:flex;align-items:center;gap:8px;width:100%;margin-top:10px;padding:9px 12px;border:1px dashed var(--line);border-radius:12px;background:var(--surface-2);color:var(--muted);font:inherit;font-size:13.5px;text-align:left;cursor:pointer}
.voice-hint:hover{color:var(--text,inherit);border-style:solid}
.voice-hint svg{flex:none;fill:var(--accent)}
.plan-out{margin-top:18px}
.plan-out .map-box{position:static;margin:14px 0}
.status{font-size:13.5px;color:var(--muted)}

/* mascot launcher (replaces the small default GBase button) */
#gptbase-bubble-button{opacity:0!important;pointer-events:none!important}
#gptbase-message-bubbles{display:none!important}
@media (min-width:640px){#gptbase-bubble-window{right:150px!important;bottom:20px!important;top:auto!important;width:var(--gb-w,370px)!important;height:var(--gb-h,min(560px,calc(100dvh - 40px)))!important;max-height:calc(100dvh - 40px)!important}}
/* enlarge/restore button (+ drag to resize) for the GBase chat window (desktop only) */
.gb-grip{position:fixed;z-index:2147483647;width:30px;height:30px;margin:-11px 0 0 -11px;border:0;padding:0;border-radius:50%;background:var(--accent,#c0446b);color:#fff;cursor:pointer;touch-action:none;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.25);opacity:.85}
.gb-grip:hover,.gb-grip:focus-visible{opacity:1}
.gb-grip[hidden]{display:none}
.gb-grip svg{fill:currentColor;pointer-events:none}
.gb-dragging #gptbase-bubble-window{pointer-events:none!important}
.gb-dragging,.gb-dragging *{cursor:nwse-resize!important;user-select:none!important}
.m-tip{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(190px + env(safe-area-inset-bottom,0px));z-index:999999991;width:min(260px,calc(100vw - 28px));background:#fff;color:#24203a;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.6;box-shadow:0 10px 26px rgba(60,20,60,.22)}
.mascot{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:999999990;border:0;background:none;padding:0;cursor:pointer;display:grid;justify-items:center;-webkit-tap-highlight-color:transparent}
.mascot .m-img{width:118px;height:auto;display:block;filter:drop-shadow(0 6px 10px rgba(60,20,60,.25));animation:m-hop 2.6s ease-in-out infinite;transform-origin:50% 100%}
.mascot:hover .m-img{animation:m-hop .9s ease-in-out infinite}
@keyframes m-hop{0%,100%{transform:translateY(0) rotate(0)}20%{transform:translateY(-6px) rotate(-4deg)}40%{transform:translateY(0) rotate(0)}60%{transform:translateY(-4px) rotate(4deg)}80%{transform:translateY(0) rotate(0)}}
.mascot .say{position:relative;background:#fff;color:#24203a;font-size:13px;font-weight:700;padding:7px 12px;border-radius:14px;box-shadow:0 6px 18px rgba(60,20,60,.18);white-space:nowrap;margin-bottom:2px;animation:say-pop 3.2s ease-in-out infinite}
.mascot .say::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
@keyframes say-pop{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (max-width:640px){.mascot .m-img{width:86px}.mascot .say{font-size:12px;padding:5px 10px}}
@media (prefers-reduced-motion:reduce){.mascot .m-img,.mascot .say{animation:none}}
footer{border-top:1px solid var(--line);padding-block:28px 40px;color:var(--muted);font-size:12.5px}
footer details summary{cursor:pointer;font-weight:700;color:var(--ink)}
footer ul{padding-left:18px;margin:8px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#home" aria-label="GBase Support - 上野散歩 AI Guide">
      <img src="img/gbase-logo.svg" width="36" height="36" alt="">
      <span class="brand-word"><b>GBase<span class="demo-tag">（研修用デモ）</span></b><small>SUPPORT</small></span>
    </a>
    <nav class="main" aria-label="Main">

景点：
- 上野恩赐公园：1873 年成为日本最早的公园之一，原为宽永寺寺域。官方资料称樱花约 1,200 棵；春季樱花大道（さくら通り）最热门。花期每年不同，不可保证某天满开。
- 国立西洋美术馆：1959 年开馆，本馆由勒·柯布西耶设计，2016 年列入世界文化遗产；前庭可免费看罗丹《思想者》《地狱之门》。周一通常休馆。
- 东京国立博物馆：1872 年创立，日本最古老的博物馆；本馆 1938 年建成，帝冠样式。周一通常休馆。
- 国立科学博物馆：恐龙骨骼、日本自然与科技展示，亲子与雨天首选。
- 上野动物园（恩赐上野动物园）：适合亲子；开放与动物展示可能变化，不可保证一定能看到某种动物。东照宫参道旁可远眺园内的旧宽永寺五重塔。
- 上野东照宫：供奉德川家康，金色殿 1651 年由家光重建，重要文化财；境内免费、金色殿内部收费；冬春有牡丹苑。
- 清水观音堂：1631 年仿京都清水寺建造，重要文化财；从「舞台」俯瞰不忍池；「月之松」圆环中可见弁天堂。免费。
- 西乡隆盛像：1898 年揭幕，高村光云作，牵着爱犬；旁边台阶通往京成上野站。
- 不忍池：公园南侧，分莲池、划船池、鸬鹚池；7–8 月荷花；弁天堂供奉弁财天；部分区域可划船，营业与费用随季节天气变化。
- 阿美横丁：上野站与御徒町站之间约 500 米商店街，起源于战后黑市；海鲜、零食、服饰、化妆品、杂货、餐饮；各店营业时间、支付方式不同，部分只收现金；年末最拥挤。
- 上野精养轩：1872 年创业的老牌西餐厅，在东照宫与清水观音堂之间。
交通：JR 山手线、京滨东北线，东京地铁银座线、日比谷线到上野站；京成上野站。去公园用「公园口」，去阿美横用「不忍口」或「广小路口」。公园口步行约 1 分钟到公园，到东京国立博物馆约 10 分钟。
示范路线：1 小时（公园口→西洋美术馆前庭→樱花大道→清水观音堂→西乡像）；2 小时自然（公园口→樱花大道→东照宫→不忍池弁天堂→清水观音堂→西乡像）；半日 3 小时（公园口→西洋美术馆→东京国立博物馆外观→东照宫→清水观音堂→西乡像→不忍池→阿美横午餐）；雨天（国立科学博物馆、东京国立博物馆、国立西洋美术馆等室内设施）。
季节：春 3 月下旬–4 月上旬樱花；夏 7–8 月荷花，注意防暑；秋 11 月下旬–12 月上旬银杏红叶；冬东照宫牡丹苑，年末阿美横热闹。
礼仪：神社「二拜、二拍手、一拜」；寺院合掌不拍手；堂内多禁止拍照；食物在店前吃完；垃圾带走；不喂乌鸦鸽子；不进入封闭区域、不触碰展品。
回答规则：只回答有依据的内容，资料没有的要说明无法确认，不编造；营业时间、休馆日、票价、活动、花期、天气、拥挤属动态信息，提醒以官方最新信息为准；路线建议先考虑时间、兴趣、同行人员、步行能力，示范路线不是实时导航；用用户使用的语言（中文、日语或英语）回答，简洁友好；遵守规则与安全。`;

const HOME_IDS = ["park","shinobazu","ameyoko","tnm"];
let spotOrder = null;
function buildSpotOrder(first){
  const lead = [first, ...HOME_IDS.filter(id => id !== first)];
  const rest = SPOTS.map(s => s.id).filter(id => !lead.includes(id));
  for (let i = rest.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [rest[i], rest[j]] = [rest[j], rest[i]]; }
  return [...lead, ...rest];
}

function routeStepsHTML(stops){ // stops: [{id, stay, why?}]
  let html = "", prev = null;
  stops.forEach((s, i) => {
    const p = byId(s.id);
    if (prev) html += `<div class="walkleg">↓ ${esc(t("walk"))} ${t("approx")}${walkMin(prev.ll, p.ll)} ${esc(t("min"))}</div>`;
    const img = p.img ? `<img src="img/${p.img}" alt="">` : `<div style="width:72px;height:72px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);font-weight:700;font-size:12px">${esc(t("start"))}</div>`;
    const meta = s.stay ? `${esc(t("stay"))} ${s.stay} ${esc(t("min"))}` : esc(t("start"));
    html += `<li><span class="num">${i+1}</span><div class="step-body">${img}<div style="min-width:0"><div class="t">${esc(L(p.name))}</div><div class="m">${meta}</div>${s.why?`<div class="w">${esc(s.why)}</div>`:(p.desc?`<div class="w" style="color:var(--muted)">${esc(L(p.tip))}</div>`:"")}</div></div></li>`;
    prev = p;
  });
  return html;
}
function totals(stops){
  let w = 0, st = 0;
  stops.forEach((s,i) => { st += s.stay||0; if (i) w += walkMin(byId(stops[i-1].id).ll, byId(s.id).ll); });
  return {w, st, all:w+st};
}

/* ---------- routing ---------- */
const VIEWS = ["home","spots","routes","food","ai"];
function route(){
  const h = (location.hash || "#home").slice(1);
  const v = VIEWS.includes(h) ? h : "home";
  VIEWS.forEach(n => { $("#v-"+n).hidden = n !== v; });
  document.querySelectorAll("nav.main a").forEach(a => a.setAttribute("aria-current", a.getAttribute("href") === "#"+v ? "page" : "false"));
  if (pendingScroll) { const el = document.getElementById(pendingScroll); pendingScroll = null; if (el) setTimeout(() => el.scrollIntoView({behavior:"smooth", block:"start"}), 30); }
  else window.scrollTo(0, 0);
}
let pendingScroll = null;
window.addEventListener("hashchange", route);
document.addEventListener("click", e => {
  const sc = e.target.closest("[data-scroll]"); if (sc) pendingScroll = sc.dataset.scroll;
  const lb = e.target.closest(".lang button");
  if (lb) { lang = lb.dataset.lang; try { localStorage.setItem("ueno-lang", lang); } catch (err) {} renderAll(); }
  const fb = e.target.closest("#filters button"); if (fb) { spotFilter = fb.dataset.f; renderSpots(); }
  const hc = e.target.closest(".hcard[data-first]"); if (hc) { spotFilter = "all"; spotOrder = buildSpotOrder(hc.dataset.first); renderSpots(); }
  if (e.target.closest('nav.main a[href="#spots"]')) { spotOrder = null; renderSpots(); }
  const rb = e.target.closest("#route-tabs button"); if (rb) { routeSel = rb.dataset.r; renderRoutes(); }
  const hr = e.target.closest("[data-route]"); if (hr) { routeSel = hr.dataset.route; renderRoutes(); }
  const qb = e.target.closest("#quick button"); if (qb) ask(qb.textContent);
  if (e.target.closest("#mascot") || e.target.closest("#voice-hint")) openGBase();
  const as = e.target.closest("[data-askspot]");
  if (as) { const s = byId(as.dataset.askspot); pendingScroll = "chat"; setTimeout(() => ask({ja:`${L(s.name)}の見どころと楽しみ方を教えてください。`,zh:`请介绍${L(s.name)}的看点和游览建议。`,en:`What should I know about ${L(s.name)}?`}[lang]), 60); }
});

function openGBase(){
  const b = document.getElementById("gptbase-bubble-button");
  if (b) { b.click(); return true; }
  let tip = document.getElementById("m-tip");
  if (!tip) { tip = document.createElement("div"); tip.id = "m-tip"; tip.className = "m-tip"; tip.setAttribute("role", "status"); document.body.appendChild(tip); }
  tip.textContent = t("m_loading"); tip.hidden = false;
  clearTimeout(openGBase.timer); openGBase.timer = setTimeout(() => { tip.hidden = true; }, 5000);
  return false;
}
/* ---------- AI ---------- */
/* Standalone build: no Claude runtime. Chat is handled by the GBase widget (see the slot before </body>); the planner uses the built-in rules in localPlan(). */
let samplePromise = (window.claude && window.claude.use) ? window.claude.use("sample").catch(() => null) : Promise.resolve(null);
let aiDead = false;
function errCopy(code){
  if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(code)) { aiDead = true; return code==="not_granted" ? t("e_denied") : t("e_unavail"); }
  if (code === "rate_limited") return t("e_rate");
  return t("e_generic");
}
function addMsg(role, text){
  const d = document.createElement("div"); d.className = "msg " + role; d.textContent = text;
  $("#msgs").appendChild(d); $("#msgs").scrollTop = $("#msgs").scrollHeight; return d;
}
const clean = s => s.replace(/\*\*(.+?)\*\*/g, "$1").replace(/^#{1,4}\s*/gm, "").replace(/^\s*[-*]\s+/gm, "・");
let turns = [], chatStarted = false, chatCtl = null, busy = false;
async function ask(q){
  q = (q || "").trim(); if (!q || busy) return;
  if (location.hash !== "#ai") { pendingScroll = "chat"; location.hash = "ai"; }
  chatStarted = true; addMsg("user", q);
  const bubble = addMsg("bot", t("thinking"));
  const sample = await samplePromise;
  if (!sample || aiDead) { bubble.textContent = t("e_unavail"); openGBase(); return; }
  busy = true; setChatBusy(true);
  turns.push({role:"user", content:q});
  const rules = `你是「上野散步 AI Guide」的导游助手。根据下面的知识库回答游客问题。\n- 用游客这一条消息所用的语言回答（日语、中文或英语）。网站当前界面语言：${LANG_NAME[lang]}。\n- 简洁、友好、具体，一般不超过 8 行；可用「・」列点；不要用 Markdown 标题或粗体。\n- 只依据知识库；没有依据的要说明无法确认，不要编造营业时间、票价或店名。\n- 动态信息（营业时间、休馆日、票价、花期、天气、拥挤）提醒以官方最新信息为准。\n- 规划路线时考虑时间、兴趣、同行人员、步行能力，并提示可在本网站「AI 向导」用规划器生成地图路线。\n\n${KB}`;
  chatCtl = new AbortController();
  try {
    const recent = turns.slice(-10);
    const res = await sample([{role:"user", content:rules}, {role:"assistant", content:"OK"}, ...recent], {cache:false, signal:chatCtl.signal, onText:({text}) => { bubble.textContent = clean(text); $("#msgs").scrollTop = $("#msgs").scrollHeight; }});
    turns.push({role:"assistant", content:res.text});
    bubble.textContent = clean(res.text);
  } catch (e) {
    turns.pop();
    if (e && e.code === "cancelled") { bubble.textContent = e.text ? clean(e.text) : "—"; }
    else { bubble.textContent = (e && e.text && e.code !== "refused" ? clean(e.text) + "\n\n" : "") + errCopy(e && e.code); bubble.classList.add("err"); }
  } finally { busy = false; setChatBusy(false); chatCtl = null; }
}
function setChatBusy(on){
  const b = $("#chat-send"); b.textContent = on ? t("stop") : t("send"); b.dataset.k = on ? "stop" : "send";
  b.type = on ? "button" : "submit"; b.onclick = on ? () => chatCtl && chatCtl.abort() : null;
}
$("#chat-form").addEventListener("submit", e => { e.preventDefault(); const v = $("#chat-q").value; $("#chat-q").value = ""; ask(v); });


/* planner */
let lastPlan = null, planBusy = false;
function readForm(){
  const val = k => [...document.querySelectorAll(`#o-${k} input:checked`)].map(i => i.value);
  const lab = (k, v) => L(OPTS[k].vals.find(x => x[0]===v)[1]);
  return {time:val("time")[0], int:val("int"), with:val("with")[0], weather:val("weather")[0], pace:val("pace")[0], extra:$("#p-extra").value.trim(),
    text(){ return `可用时间: ${this.time} 分钟; 兴趣: ${this.int.map(v=>lab("int",v)).join(", ")||"不限"}; 同行: ${lab("with",this.with)}; 天气: ${lab("weather",this.weather)}; 步行节奏: ${lab("pace",this.pace)}; 其他: ${this.extra||"无"}`; }};
}
$("#plan-form").addEventListener("submit", async e => {
  e.preventDefault(); if (planBusy) return;
  const f = readForm();
  const st = $("#plan-status"), btn = $("#plan-btn");
  const sample = await samplePromise;
  if (!sample || aiDead) { localPlan(f); return; }
  planBusy = true; btn.disabled = true; st.textContent = t("planning");
  const list = SPOTS.map(s => `${s.id}: ${s.name.zh} / ${s.name.en} [${s.cat.join(",")}] — ${s.desc.zh}`).join("\n");
  const prompt = `你是上野散步路线规划师。根据游客条件，从下列景点中挑选并排序，组成一条从「sta」(JR上野站公园口) 出发的步行路线。\n可选景点 id:\n${list}\n\n游客条件: ${f.text()}\n\n要求:\n- 第一站必须是 {"id":"sta","stay":0}。之后只用上面列出的 id，不重复。\n- 停留分钟 + 步行时间（相邻景点约 5–12 分钟）合计不超过可用时间。雨天以室内博物馆为主；带孩子或长辈减少站数、多安排休息；炎热时避开长时间户外。\n- 按地理顺序排列，避免折返（博物馆在公园北侧，东照宫在西侧，清水观音堂和西乡像在南侧，不忍池在西南，阿美横在最南）。\n- 所有文字用${LANG_NAME[lang]}书写。why 每条一句话，说明为何适合这位游客。\n- 不要编造知识库以外的营业时间、票价或店名。\n\n知识库:\n${KB}\n\n只回复一个 JSON 对象，格式:\n{"title":"路线名","summary":"两句话概述","stops":[{"id":"sta","stay":0,"why":"..."},{"id":"park","stay":15,"why":"..."}],"tips":["提示1","提示2"]}`;
  try {
    const out = await sample.json(prompt, {cache:false});
    const valid = new Set(["sta", ...SPOTS.map(s=>s.id)]), seen = new Set();
    let stops = (Array.isArray(out && out.stops) ? out.stops : []).filter(s => s && valid.has(s.id) && !seen.has(s.id) && seen.add(s.id)).map(s => ({id:s.id, stay:Math.max(0, Math.min(240, Number(s.stay)||0)), why:String(s.why||"")}));
    if (!stops.length || stops[0].id !== "sta") stops.unshift({id:"sta", stay:0, why:""});
    if (stops.length < 2) throw {code:"invalid_json"};
    lastPlan = {title:String(out.title||t("plan_res")), summary:String(out.summary||""), stops, tips:(Array.isArray(out.tips)?out.tips:[]).map(String).slice(0,4), lang};
    renderPlan(lastPlan); st.textContent = "";
    $("#plan-out").scrollIntoView({behavior:"smooth", block:"start"});
  } catch (err) {
    st.textContent = err && err.code === "invalid_json" ? t("e_plan") : errCopy(err && err.code);
  } finally { planBusy = false; btn.disabled = false; }
});
function localPlan(f){
  const time = Number(f.time) || 120;
  let r = f.weather === "rain" ? ROUTES.find(x => x.id === "rain") : time <= 60 ? ROUTES.find(x => x.id === "r60") : time <= 120 ? ROUTES.find(x => x.id === "r120") : ROUTES.find(x => x.id === "r180");
  let stops = r.stops.map(([id, stay]) => ({id, stay, why:""}));
  if (f.weather !== "rain" && (f.int.includes("food") || f.int.includes("shopping")) && !stops.some(s => s.id === "ameyoko") && time >= 120) stops.push({id:"ameyoko", stay:30, why:""});
  if (f.weather !== "rain" && f.int.includes("museum") && !stops.some(s => s.id === "nmwa" || s.id === "tnm" || s.id === "science") && time >= 120) stops.splice(1, 0, {id:"nmwa", stay:30, why:""});
  const tips = [L(r.note)];
  if (f.with === "kids") tips.push({ja:"子ども連れなら国立科学博物館や上野動物園を組み合わせるのもおすすめです。",zh:"带孩子的话，可以加上国立科学博物馆或上野动物园。",en:"With kids, consider adding the science museum or Ueno Zoo."}[lang]);
  if (f.with === "senior" || f.pace === "easy") tips.push({ja:"ベンチの多い噴水広場や不忍池のほとりでこまめに休憩しましょう。",zh:"喷水广场和不忍池畔长椅多，记得适时休息。",en:"Take breaks at the Fountain Plaza or by Shinobazu Pond, where benches are plentiful."}[lang]);
  if (f.weather === "hot") tips.push({ja:"暑い日は水分補給を忘れずに。屋内の博物館を組み合わせると快適です。",zh:"天热注意补水，可以穿插室内博物馆。",en:"Drink plenty of water on hot days; mixing in an indoor museum helps."}[lang]);
  lastPlan = {title:L(r.name), summary:L(r.sub), stops, tips, lang};
  renderPlan(lastPlan); $("#plan-status").textContent = "";
  $("#plan-out").scrollIntoView({behavior:"smooth", block:"start"});
}
function renderPlan(p){
  const box = $("#plan-out"); box.hidden = false;
  const tt = totals(p.stops);
  box.innerHTML = `<div class="eyebrow">${esc(t("plan_res"))}</div><h3 style="font-size:20px;margin-top:4px">${esc(p.title)}</h3>
   <p style="margin:6px 0 0">${esc(p.summary)}</p>
   <div class="route-sum"><span>${esc(t("total"))} <b>${t("approx")}${Math.round(tt.all/5)*5} ${esc(t("min"))}</b></span><span>${esc(t("walk_total"))} <b>${t("approx")}${tt.w} ${esc(t("min"))}</b></span></div>
   <div class="map-box">${mapSVG(p.stops.map(s=>s.id))}</div>
   <ol class="steps">${routeStepsHTML(p.stops)}</ol>
   ${p.tips.length ? `<div class="note">${p.tips.map(x=>"・"+esc(x)).join("<br>")}</div>` : ""}`;
}

/* ---------- boot ---------- */
renderAll(); route();
})();
</script>

<script>
/* ---------- GBase chat window: grip button (desktop) — click = enlarge/restore, drag = free resize ---------- */
(() => {
  const KEY = "ueno-gb-size", root = document.documentElement;
  const ICON_MAX = '<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v2H7.4l4.3 4.3-1.4 1.4L6 7.4V11H4zM20 20h-7v-2h3.6l-4.3-4.3 1.4-1.4 4.3 4.3V13h2z"/></svg>';
  const ICON_MIN = '<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 11H4V9h3.6L3.3 4.7l1.4-1.4L9 7.6V4h2zM13 13h7v2h-3.6l4.3 4.3-1.4 1.4-4.3-4.3V20h-2z"/></svg>';
  const TIP = {
    max: "クリックで拡大・ドラッグでサイズ変更 / 点击放大·拖动调整大小 / Click to enlarge, drag to resize",
    min: "クリックで元のサイズ・ドラッグでサイズ変更 / 点击还原·拖动调整大小 / Click to restore, drag to resize"
  };
  const grip = document.createElement("button");
  grip.type = "button"; grip.className = "gb-grip"; grip.hidden = true;
  document.body.appendChild(grip);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const limits = () => ({ maxW: Math.max(320, innerWidth - 170), maxH: Math.max(360, innerHeight - 40) });
  let custom = false;                       /* true when a size is set (enlarged or dragged) */
  function setIcon(){
    grip.innerHTML = custom ? ICON_MIN : ICON_MAX;
    grip.title = custom ? TIP.min : TIP.max;
    grip.setAttribute("aria-label", custom ? "Restore chat window size" : "Enlarge chat window");
  }
  function apply(w, h, save){
    const { maxW, maxH } = limits();
    w = clamp(Math.round(w), 320, maxW); h = clamp(Math.round(h), 360, maxH);
    root.style.setProperty("--gb-w", w + "px"); root.style.setProperty("--gb-h", h + "px");
    custom = true; setIcon();
    if (save) { try { localStorage.setItem(KEY, JSON.stringify([w, h])); } catch (e) {} }
    place();
  }
  function reset(){
    root.style.removeProperty("--gb-w"); root.style.removeProperty("--gb-h");
    custom = false; setIcon();
    try { localStorage.removeItem(KEY); } catch (e) {}
    place();
  }
  function enlarge(){ const { maxW } = limits(); apply(Math.min(760, maxW), innerHeight - 90, true); }   /* stays below the 60px header */
  setIcon();
  try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (Array.isArray(s)) apply(s[0], s[1], false); } catch (e) {}
  let frame = null;
  function place(){
    const open = frame && frame.style.display !== "none" && innerWidth >= 640;
    grip.hidden = !open; if (!open) return;
    const r = frame.getBoundingClientRect();
    grip.style.left = r.left + "px"; grip.style.top = r.top + "px";
  }
  function hook(){
    const f = document.getElementById("gptbase-bubble-window");
    if (!f || f === frame) return;
    frame = f;
    new MutationObserver(() => requestAnimationFrame(place)).observe(f, { attributes: true, attributeFilter: ["style"] });
    place();
  }
  new MutationObserver(hook).observe(document.body, { childList: true });
  hook();
  addEventListener("resize", () => requestAnimationFrame(place));
  let start = null, moved = false;
  grip.addEventListener("pointerdown", e => {
    if (!frame || e.button) return;
    e.preventDefault(); grip.setPointerCapture(e.pointerId);
    const r = frame.getBoundingClientRect();
    start = { x: e.clientX, y: e.clientY, w: r.width, h: r.height }; moved = false;
  });
  grip.addEventListener("pointermove", e => {
    if (!start) return;
    const dx = start.x - e.clientX, dy = start.y - e.clientY;
    if (!moved && Math.hypot(dx, dy) < 5) return;   /* small wobble still counts as a click */
    if (!moved) { moved = true; root.classList.add("gb-dragging"); }
    apply(start.w + dx, start.h + dy, false);
  });
  grip.addEventListener("pointerup", () => {
    if (!start) return; start = null; root.classList.remove("gb-dragging");
    if (moved) { const r = frame.getBoundingClientRect(); apply(r.width, r.height, true); }
    else if (custom) reset(); else enlarge();
  });
  grip.addEventListener("pointercancel", () => { start = null; root.classList.remove("gb-dragging"); });
  grip.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); custom ? reset() : enlarge(); return; }
    const d = { ArrowLeft:[20,0], ArrowRight:[-20,0], ArrowUp:[0,20], ArrowDown:[0,-20] }[e.key];
    if (!d || !frame) return; e.preventDefault();
    const r = frame.getBoundingClientRect(); apply(r.width + d[0], r.height + d[1], true);
  });
})();
</script>
